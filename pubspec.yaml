name: flutter_browser_app
description: "MyTube, a Flutter video and music browser for Android and iOS."
publish_to: 'none'
version: 1.0.1+105

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.6.0
  youtube_explode_dart: ^3.1.0
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7
  ytmusicapi_dart: ^2.4.1
  dio: ^5.11.0
  audio_service: ^0.18.19
  audio_session: ^0.2.4
  package_info_plus: ^10.2.1
  path_provider: ^2.1.6
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/mytube_splash_source.png
