<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="MyTube – dein persönlicher Video- und Musikbrowser.">
  <meta name="theme-color" content="#F24942">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="MyTube">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>MyTube</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      margin: 0;
      min-height: 100%;
      background: #fdf8ea;
    }

    #mytube-splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: grid;
      place-items: center;
      background: #fdf8ea;
      opacity: 1;
      transition: opacity 180ms ease-out;
      pointer-events: none;
    }

    #mytube-splash.is-hidden {
      opacity: 0;
    }

    #mytube-splash img {
      width: min(72vw, 440px);
      height: auto;
    }
  </style>
</head>
<body>
  <div id="mytube-splash" aria-label="MyTube wird geladen">
    <img src="icons/MyTube-Splash.png" alt="MyTube">
  </div>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    const hideMyTubeSplash = () => {
      const splash = document.getElementById('mytube-splash');
      if (!splash || splash.classList.contains('is-hidden')) return;
      splash.classList.add('is-hidden');
      window.setTimeout(() => splash.remove(), 200);
    };
    window.addEventListener('flutter-first-frame', hideMyTubeSplash, { once: true });
    window.setTimeout(hideMyTubeSplash, 15000);
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
